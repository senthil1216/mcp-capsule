[project]
name = "capsule"
version = "0.1.0"
description = "Capsule — a capability gateway for MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Senthil Sivasubramanian" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
sandbox = ["docker>=7.0"]
dev = ["pytest>=8.0"]

[project.scripts]
capsule = "capsule.cli:main"
capsule-approve = "capsule.approve:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["capsule", "tools", "bench", "demo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "docker: integration tests that require a running container runtime",
]
