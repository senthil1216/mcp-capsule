name: ci

on:
  push:
  pull_request:

jobs:
  # Fast checkout proof: models, policy, and taint tests run with no Docker.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit / policy / taint tests
        run: pytest -q

  # Docker integration tests are gated behind a job where a runtime is available.
  # Marked with @pytest.mark.docker; skipped automatically when no daemon.
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sandbox]"
      - name: Docker-backed sandbox tests
        run: pytest -q -m docker
