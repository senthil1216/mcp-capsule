name: ci

on:
  push:
  pull_request:

jobs:
  # Lint + format gate (ruff). Fast, no install of the package needed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  # Core correctness + security invariants, on every supported Python.
  # test_report.py asserts secret_reach_safe==0, taint handled, false_denies==0,
  # so a regression in containment fails this job — the security properties are
  # CI-enforced, not just documented.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Unit / policy / taint tests
        run: pytest -q

  # Regenerate the apples-to-apples report and assert the headline invariants,
  # then publish bench/REPORT.md as an artifact. (curl is preinstalled on the
  # runner; no Docker needed for the read/taint rows.)
  security-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Run attack corpus (unsafe + safe)
        run: python -m bench.runner --mode both
      - name: Assert security invariants
        run: pytest -q tests/test_report.py
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: bench/REPORT.md

  # Docker integration tests — gated behind a job with a runtime. Inert until
  # Milestone D adds @pytest.mark.docker tests; runs (and passes) cleanly today.
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sandbox]"
      - name: Docker-backed sandbox tests
        # Until Milestone D adds @pytest.mark.docker tests, pytest collects none
        # and exits 5 ("no tests ran"). Treat that as success; fail on real
        # failures only.
        run: |
          set +e
          pytest -q -m docker
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then
            echo "docker-marked tests: exit $code (0=passed, 5=none collected yet) -> OK"
            exit 0
          fi
          exit "$code"
