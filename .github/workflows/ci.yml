name: CI

# Runs the runtime-free base test suite + lint on every push/PR.
# Docker-marked integration tests are intentionally NOT run here (they need a
# container runtime); run them locally with `make test-docker`.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + mcp extras; sandbox extras are docker-side)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (base suite; docker tests deselected)
        run: pytest -q
